<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item - Acity connect</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
        <nav>
        <div class="Logo">Acity Connect</div>
        <div  class="links">
            <a href="marketplace.html"><b>Home</b></a>
           
        </div>
    </nav>

    <div class="create">
        <h2>Create a Listing</h2>

        <form id="ItemForm">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" placeholder="Enter Item Name" required>
            
            <label for="description">Description:</label>
            <textarea id="description" name="description" placeholder="Enter Item description" required></textarea>
            
            <label for="category">Category:</label>
            <select id="category" name="category" required>
                <option value="">Loading categories…</option>
            </select>

            <label for="images">Photos <small>(optional, JPEG/PNG/WebP/GIF, up to 8, max 5MB each)</small></label>
            <input type="file" id="images" name="images" accept="image/jpeg,image/png,image/webp,image/gif" multiple>

            <button class="Add-button" type="submit">Create Item</button>
        </form>
    </div>
    <script src="js/config.js"></script>
    <script src="js/listings.js"></script>
</body>
</html>
