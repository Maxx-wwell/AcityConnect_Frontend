<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Listing | Acity connect</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <div class="Logo">Acity Connect</div>
        <div  class="links">
            <a href="marketplace.html"><b>Marketplace</b></a>
            <a href="trades.html"><b>Trades</b></a>
        </div>
    </nav>
     <section class="profile">
        <div class="profile-card">
            <h2>Welcome, Student!</h2>
        </div>

        <form class="profile-form">
            <h3>Personal Information</h3>
            <div class="form-grup">
                <h3>Full Name</h3>
                <input type="text" value="Acity Student" placeholder="Enter your name">
            </div>

            <div class="form-grup">
                <h3>Skills Needed</h3>
                <input type="text" placeholder="e.g Python, Graphic Design, Tutoring">
            </div>
            <div class="form-grup">
                <h3>Skills Offered</h3>
                <input type="text" placeholder="e.g Python, Graphic Design, Tutoring">
            </div>
             
             <div class="user-activity">
                <h3>My Active Listings</h3>
                <p style="color: #fffefe;">You haven't posted any items or skills yet</p>
                <button class="interest" style="width:auto; padding: 10px 20px; margin-left: 10px;"><a href="createlisting.html">+Create New Listing</a> </button>
             </div>
        </form>
     </section>
</body>
</html>
