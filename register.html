<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
        <nav> 
        <div class="Logo">ACITY CONNECT</div>
        <div class="links">
            <a href="index.html"><b>HOME</b></a>
        </div>
    </nav>

    <div class="register">
        <h2>Create Account</h2>
        <p>Email Required - @acity.edu.gh</p>
        
    </div>

    <form action="#" method="post">
        <div class="form-grp">
            <label for="fullname">Full Name</label>
            <input type="text" name="fullname" id="fullname" required>
        </div>

        <div class="form-grp">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="name@acity.edu.gh" pattern=".+@acity\.edu\.gh" title="Registration is restricted to @acity.edu.gh emails" required>
        </div>

        <div class="form-grp">
            <label for="password">Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="submit">Complete Registration</button>
        <p id="acc">Already have an account? <a href="login.html">Login here</a></p>

    </form>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
